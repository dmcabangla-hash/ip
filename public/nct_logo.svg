<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="nctBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="85%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="nctRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Rings -->
  <circle cx="100" cy="100" r="98" fill="url(#nctBg)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  <circle cx="100" cy="100" r="91" fill="none" stroke="url(#nctRed)" stroke-width="2.5" stroke-dasharray="8 3"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#444444" stroke-width="1.5"/>

  <!-- Eagle Silhouette / Cyber Wings -->
  <g fill="#252525" opacity="0.9">
    <path d="M 100 40 L 115 58 L 135 50 L 125 70 L 148 72 L 130 88 L 155 96 L 128 106 L 140 125 L 120 120 L 115 140 L 100 125 L 85 140 L 80 120 L 60 125 L 72 106 L 45 96 L 70 88 L 52 72 L 75 70 L 65 50 L 85 58 Z"/>
    <circle cx="100" cy="65" r="7" fill="#ED1C24" opacity="0.8"/>
  </g>

  <!-- Ornate tribal/cyber flourishes bottom -->
  <path d="M 70 148 Q 100 162 130 148 Q 115 158 100 158 Q 85 158 70 148 Z" fill="url(#nctRed)"/>
  <path d="M 80 154 Q 100 166 120 154" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <!-- Main 'NCT' Text -->
  <text x="100" y="105" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">
    NCT
  </text>

  <!-- Slogan: Let the war begin -->
  <text x="100" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="8.5" fill="#ED1C24" letter-spacing="1">
    Let the war begin
  </text>
</svg>
